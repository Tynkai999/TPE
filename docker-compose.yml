services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tpe_message_app
    volumes:
      - .:/var/www
      - vendor:/var/www/vendor        
    environment:
      - PHP_IDE_CONFIG=serverName=tpe_message
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  nginx:
    image: nginx:stable-alpine
    container_name: tpe_message_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: tpe_message_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tpe_message
      POSTGRES_USER: tpe_message
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - tpe_message_pgdata:/var/lib/postgresql/data

volumes:
  tpe_message_pgdata:
  vendor:             